---
# Applies the default OS configuration. Linux hosts need root (become); Windows hosts connect as an administrator.
# Hosts must be in the linux or windows group; anything else in the inventory is left alone.

- name: Apply default OS configuration to Linux hosts
  hosts: linux
  become: true
  gather_facts: true
  gather_subset: [min]
  roles:
    - role: defos

- name: Apply default OS configuration to Windows hosts
  hosts: windows
  gather_facts: true
  gather_subset: [min]
  roles:
    - role: defos
