---
# roles/defos/tasks/main.yml
#
# Each part of the baseline is its own role, and each role handles the OS differences itself. include_role is dynamic,
# so `apply` passes the tags on to the role's tasks; without it, --tags local-accounts would run the include and skip
# everything in it. The tag list on the include is what lets a role's own tags be selected from here.

# Features run first: adding OpenSSH Server creates an open firewall rule that ans_firewall then replaces, and starts
# sshd, which creates the sshd_config that ans_local_accounts edits.
- name: Add and remove Windows features
  ansible.builtin.include_role:
    name: ans_features
    apply:
      tags: [features]
  when:
    - ansible_facts['os_family'] == 'Windows'
    - defos_enable_features | bool
  tags: [features, openssh, telnet]

- name: Install and remove packages
  ansible.builtin.include_role:
    name: ans_packages
    apply:
      tags: [packages]
  when: defos_enable_packages | bool
  tags: [packages, powershell]

- name: Configure the firewall
  ansible.builtin.include_role:
    name: ans_firewall
    apply:
      tags: [firewall]
  when: defos_enable_firewall | bool
  tags: [firewall, builtin, rdp, remoteadmin, ssh, mssql, sql, firewalld, validate]

- name: Manage local users and groups
  ansible.builtin.include_role:
    name: ans_local_accounts
    apply:
      tags: [local-accounts]
  when: defos_enable_local_accounts | bool
  tags: [local-accounts]

# --- Local Administrators group membership (Windows) ---
# The domain is read locally rather than from Active Directory so this needs no
# ADWS access and therefore no credential delegation from the controller.
- name: Add the domain administrators group to local Administrators
  when:
    - ansible_facts['os_family'] == 'Windows'
    - defos_enable_local_admin_group | bool
    - defos_local_admin_groups | length > 0
  tags: [localadmin-group]
  block:
    - name: Detect Active Directory domain membership
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem
          [pscustomobject]@{
            Domain       = $cs.Domain
            PartOfDomain = [bool]$cs.PartOfDomain
          }
      register: defos_domain_info
      changed_when: false

    - name: Add the group for this host's domain
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ defos_local_admin_groups[defos_domain_info.output[0].Domain] }}"
        state: present
      when:
        - defos_domain_info.output[0].PartOfDomain | bool
        - defos_domain_info.output[0].Domain in defos_local_admin_groups
