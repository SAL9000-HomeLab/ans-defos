---
# roles/defos/defaults/main.yml
#
# Each role has its own settings (ans_features_*, ans_packages_*, ans_firewall_*, ans_local_accounts_*): set them
# directly on the inventory, group or host. They are not passed through this role, because include_role vars would
# override what the inventory sets.

# --- Which roles to apply ---
# ans_features and ans_packages change nothing until their per-feature and per-package variables are set, such as
# ans_features_openssh_server: present or ans_packages_powershell: present.
defos_enable_features: true
defos_enable_packages: true
defos_enable_firewall: true
defos_enable_local_accounts: true

# --- Local Administrators group membership (Windows) ---
defos_enable_local_admin_group: true
# Domain group granted local administrator rights, keyed by AD domain. Membership
# is added, not set, so accounts already in local Administrators are left alone.
# Hosts that are not domain-joined, or that are joined to a domain absent from
# this map, are skipped. Set the real map on the AWX inventory or group, e.g.
#   defos_local_admin_groups:
#     ad.example.com: 'EXAMPLE\ServerAdmins'
defos_local_admin_groups: {}
