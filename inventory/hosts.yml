---
# Example inventory: placeholder host names only. The real inventory lives in AWX
# (or a gitignored local/ copy). Keep the linux and windows groups; the plays in
# site.yml key off them. Windows hosts are grouped by version and by install type
# (core or desktop experience); Windows 11 hosts are in windows_11 only.
all:
  children:
    linux:
      hosts:
        app-01.lab.example.com:

    windows:
      children:
        windows_2025:
        windows_11:
        windows_2022:
        windows_2019:
        windows_core:
        windows_gui:
      vars:
        ansible_connection: psrp
        ansible_psrp_auth: kerberos
        ansible_psrp_protocol: https
        ansible_psrp_cert_validation: ignore

    windows_2025:
      hosts:
        w25c-test001.lab.example.com:
        w25g-test001.lab.example.com:

    windows_11:
      hosts:
        w11-test001.lab.example.com:

    windows_2022:
      hosts:
        w22c-test001.lab.example.com:
        w22g-test001.lab.example.com:

    windows_2019:
      hosts:
        w19c-test001.lab.example.com:
        w19g-test001.lab.example.com:

    windows_core:
      hosts:
        w25c-test001.lab.example.com:
        w22c-test001.lab.example.com:
        w19c-test001.lab.example.com:

    windows_gui:
      hosts:
        w25g-test001.lab.example.com:
        w22g-test001.lab.example.com:
        w19g-test001.lab.example.com:
